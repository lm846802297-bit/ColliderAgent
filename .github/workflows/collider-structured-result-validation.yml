name: Collider structured result validation

on:
  pull_request:
    paths:
      - "docs/schemas/**"
      - "docs/STRUCTURED_RESULT_DATA_STANDARD.md"
      - "docs/STRUCTURED_RESULT_DATA_STANDARD_v1.0.1.md"
      - "docs/STRUCTURED_RESULT_DATA_STANDARD_v1.0.1.zh-CN.md"
      - ".github/workflows/collider-structured-result-validation.yml"
  push:
    branches:
      - main
    paths:
      - "docs/schemas/**"
      - "docs/STRUCTURED_RESULT_DATA_STANDARD.md"
      - "docs/STRUCTURED_RESULT_DATA_STANDARD_v1.0.1.md"
      - "docs/STRUCTURED_RESULT_DATA_STANDARD_v1.0.1.zh-CN.md"
      - ".github/workflows/collider-structured-result-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned validation dependency
        run: python -m pip install -r docs/schemas/requirements-result-validation.txt

      - name: Run RCRPS v1.0.1 schema, source-control semantic, and legacy compatibility tests
        run: python -m unittest discover -s docs/schemas/tests -v

      - name: Compile validator
        run: python -m compileall -q docs/schemas
